deptrac:
  paths:
    - ../src
    - ../runtime
    - ../bootstrap
  exclude_files:
    - '#.*vendor.*#'

  layers:
    - name: Accounts
      collectors:
        - type: directory
          value: ../src/Accounts/.*
    - name: Activity
      collectors:
        - type: directory
          value: ../src/Activity/.*
    - name: Runtime
      collectors:
        - type: directory
          value: ../runtime/.*
    - name: Bootstrap
      collectors:
        - type: directory
          value: ../bootstrap/.*

  ruleset:
    Accounts:
      - Activity
      - Runtime
    Activity:
      - Runtime
    Runtime: []
    Bootstrap:
      - Accounts
      - Activity
      - Runtime
