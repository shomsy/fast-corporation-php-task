name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run quality suite
        run: composer quality

      - name: Live HTTP and CLI acceptance
        run: python3 tests/Flow/live_smoke.py

      - name: Reversible UI route cutover and rollback
        run: python3 tests/Flow/route_cutover.py

      - name: Set up Node for browser acceptance
        if: matrix.php == '8.5'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dev-only browser test runner
        if: matrix.php == '8.5'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Native ES module and accessibility tests
        if: matrix.php == '8.5'
        run: npm run test:frontend

      - name: Chrome SPA end-to-end acceptance
        if: matrix.php == '8.5'
        run: |
          google-chrome --version
          npm run test:browser
