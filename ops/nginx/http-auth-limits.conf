# Include once in the nginx "http" block at the trusted, single ingress.
# Empty keys are ignored: GET, downloads and unrelated POSTs remain unaffected.
# Do not trust X-Forwarded-For from arbitrary clients. $binary_remote_addr is the
# connected peer; a *separately reviewed* real_ip trust list is needed behind a CDN.
map "$request_method:$uri" $fc_auth_limit_key {
    default "";
    ~^POST:/api/accounts/(login|register)$ $binary_remote_addr;
}

# Worker-shared memory on ONE Nginx instance; independent ingress replicas do NOT
# share counters. Do not multiply public ingress without a shared gateway policy.
limit_req_zone $fc_auth_limit_key zone=fc_auth_per_peer:1m rate=6r/m;

# Sanitized record: no query string, POST body, cookies, passwords or user input.
log_format fc_auth_rate '$remote_addr method=$request_method path=$uri status=$status limit=$limit_req_status';
